[project]
name = "fastapi-stack-demo"
version = "0.1.0"
description = "Тестовый стек: FastAPI + PostgreSQL + Redis + Celery + Vue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3,<5.7",
    "fastapi[standard]>=0.141.1",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9.0",
    "redis[hiredis]>=6.0,<6.5",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

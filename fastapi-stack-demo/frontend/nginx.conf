# Внутренний nginx контейнера: только статика. Проксирование /api и /ws делает nginx хоста.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # immutable только для хешированных файлов Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

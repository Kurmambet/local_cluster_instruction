---
# Аудит секретов: grep -n vault_ host_vars/lab-vm.yml
admin_user: ubuntu
base_swap_size_mb: 0 # на этих ВМ потом будет Kubernetes
nginx_catch_all: false

nginx_sites:
  - name: lab
    server_names: ["_"]
    default_server: true
    tls: false
    locations:
      - path: /api/
        proxy_pass: "http://127.0.0.1:8000"
        rate_limit: true
        burst: 40
      - path: /ws/
        proxy_pass: "http://127.0.0.1:8000"
        websocket: true
        timeout: 120s
        access_log: false
      - path: /grafana/ # у Grafana свой вход (пароль в secrets.env)
        proxy_pass: "http://127.0.0.1:3000"
      - path: /
        proxy_pass: "http://127.0.0.1:8080"

apps:
  - name: fastapi-demo
    path: /opt/fastapi-demo
    source_dir: "/home/comp/projects/kuber2/fastapi-stack-demo"
    deploy_mode: build
    env_files:
      - dest: .env # единственный env-файл на сервере (аналог корневого .env)
        vars:
          # --- открытые настройки ---
          FASTAPI_APP_ENV: production
          FASTAPI_DEBUG: "false"
          FASTAPI_JWT_ALGORITHM: HS256
          FASTAPI_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          FASTAPI_CORS_ORIGINS: "[]"
          FASTAPI_POSTGRES_DB: demo
          FASTAPI_POSTGRES_USER: demo
          FASTAPI_DATABASE_POOL_SIZE: "5"
          FASTAPI_DATABASE_MAX_OVERFLOW: "5"
          FASTAPI_SQL_ECHO: "false"
          NPM_REGISTRY: "https://npm-mirror.gitverse.ru"
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ROOT_URL: "http://{{ ansible_host }}/grafana/"
          # --- секреты: ТОЛЬКО из vault.yml ---
          FASTAPI_POSTGRES_PASSWORD: "{{ vault_demo_postgres_password }}"
          FASTAPI_REDIS_PASSWORD: "{{ vault_demo_redis_password }}"
          FASTAPI_JWT_SECRET_KEY: "{{ vault_demo_jwt_secret }}"
          GRAFANA_ADMIN_PASSWORD: "{{ vault_demo_grafana_password }}"

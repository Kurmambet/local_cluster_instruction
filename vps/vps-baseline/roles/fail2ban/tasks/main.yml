---
- name: Установить fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Настроить jail для sshd
  ansible.builtin.template:
    src: jail-sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-sshd.local
    mode: "0644"
  notify: Restart fail2ban

- name: Включить и запустить fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

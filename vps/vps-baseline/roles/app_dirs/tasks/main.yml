---
- name: Каталоги проектов
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Каталог shared для env-файлов (вне git-репозитория)
  ansible.builtin.file:
    path: "{{ item.path }}/shared"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Env-файлы с секретами
  ansible.builtin.template:
    src: env.j2
    dest: "{{ item.0.path }}/shared/{{ item.1.dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  loop: "{{ apps | subelements('env_files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.dest }}"
  no_log: true

---
- name: Проверить наличие сертификатов
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  register: nginx_cert_stats

- name: Собрать словарь «сайт -> сертификат готов»
  ansible.builtin.set_fact:
    nginx_cert_ready: >-
      {{ dict(nginx_cert_stats.results | map(attribute='item.name')
      | zip(nginx_cert_stats.results | map(attribute='stat.exists'))) }}

- name: Конфиги виртуальных хостов
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Проверить синтаксис nginx
  ansible.builtin.command: nginx -t
  changed_when: false

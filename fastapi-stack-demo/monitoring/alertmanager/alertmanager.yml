route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Пока уведомления никуда не уходят: алерты видны в UI Alertmanager (127.0.0.1:9093).
  - name: default

# Пример доставки в Telegram. Токен — СЕКРЕТ: его нельзя коммитить в этот файл.
# Положи токен в файл на сервере (например, shared/secrets/telegram_token через Ansible),
# смонтируй его в контейнер и укажи bot_token_file:

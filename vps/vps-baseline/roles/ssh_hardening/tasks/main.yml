---
- name: Определить пользователя, под которым подключился Ansible
  ansible.builtin.set_fact:
    ssh_connecting_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['user_id']) }}"

- name: Защита от потери доступа — пользователь и список AllowUsers
  ansible.builtin.assert:
    that:
      - ssh_connecting_user != 'root'
      - ssh_connecting_user in ssh_allow_users
    fail_msg: >-
      Ansible подключён как '{{ ssh_connecting_user }}'. Для закрытия root-входа нужно
      подключаться непривилегированным админом из списка ssh_allow_users (сначала bootstrap.yml).
    quiet: true

- name: Проверить, что у админа есть authorized_keys
  ansible.builtin.stat:
    path: "/home/{{ ssh_connecting_user }}/.ssh/authorized_keys"
  register: ssh_admin_keys

- name: Не отключать пароли, если у админа нет ключей
  ansible.builtin.assert:
    that:
      - ssh_admin_keys.stat.exists
      - ssh_admin_keys.stat.size > 0
    fail_msg: "У {{ ssh_connecting_user }} нет ~/.ssh/authorized_keys — отключение паролей закроет доступ"
    quiet: true

- name: Убедиться, что sshd читает /etc/ssh/sshd_config.d/*.conf
  ansible.builtin.command: grep -Eq '^Include[[:space:]]+/etc/ssh/sshd_config.d/\*\.conf' /etc/ssh/sshd_config
  changed_when: false

- name: Положить конфиг усиления SSH
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Проверить итоговую конфигурацию sshd
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
